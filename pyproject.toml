[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-cafeteria-waste"
version = "0.1.0"
description = "Smart Cafeteria Waste Tracker — one-camera CV prototype"
requires-python = ">=3.11"
dependencies = [
    "opencv-python==4.9.0.80",
    "ultralytics>=8.2.0",
    "insightface>=0.7.3",
    "onnxruntime>=1.18.0",
    "numpy>=1.26.0,<2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "streamlit>=1.35.0",
    "pyyaml>=6.0.1",
    "pillow>=10.3.0",
    "psutil>=5.9.8",
    "plotly>=5.22.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.1",
    "scipy>=1.13.0",
    "watchdog>=4.0.0",
    "cryptography>=42.0.0",
    # Live camera in browser (enrollment wizard)
    "streamlit-webrtc>=0.47.0",
    "aiortc>=1.6.0",
    "av>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.4.0",
]
# Face recognition — requires Python ≤3.11 for onnxruntime wheels.
# Install manually if using Python 3.11:
#   pip install onnxruntime insightface
face = []
gpu = [
    # Install torch with CUDA separately:
    # pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
    # pip install onnxruntime-gpu
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
norecursedirs = [".git", ".venv", "venv", "node_modules", "models", "data", "dist", "build", "logs", "dashboard"]
timeout = 60
addopts = "-v --tb=short --ignore=.venv --ignore=src --ignore=models --ignore=data --ignore=dashboard"

[tool.ruff]
line-length = 100
target-version = "py311"
