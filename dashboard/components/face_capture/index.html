<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face scan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 8px 12px;
    }
    #eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 4px;
    }
    #instruction {
      font-size: 1.45rem;
      font-weight: 700;
      color: #f8fafc;
      text-align: center;
      min-height: 34px;
      letter-spacing: -0.03em;
    }
    #coach {
      font-size: 0.92rem;
      color: #94a3b8;
      text-align: center;
      margin: 4px 0 12px;
      min-height: 20px;
    }
    #video-wrap {
      position: relative;
      width: 340px;
      height: 440px;
      border-radius: 32px;
      overflow: hidden;
      background: #070b14;
      box-shadow: 0 18px 50px rgba(0,0,0,0.4);
    }
    #video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #mask-canvas, #overlay, #flash {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    #flash { background: #fff; opacity: 0; transition: opacity 0.07s; }
    #thumbs {
      display: flex; gap: 6px; margin-top: 12px; min-height: 44px;
      justify-content: center; flex-wrap: wrap; max-width: 340px;
    }
    .thumb {
      width: 40px; height: 40px; border-radius: 8px; object-fit: cover;
      border: 2px solid #34d399;
    }
    #status { margin-top: 8px; font-size: 0.8rem; color: #64748b; text-align: center; min-height: 18px; }
    #complete-panel {
      display: none; flex-direction: column; align-items: center; gap: 8px;
      background: #0b1220;
      border: 1px solid #14532d; border-radius: 20px;
      padding: 28px 24px; text-align: center; max-width: 360px;
    }
    #complete-panel h2 { color: #6ee7b7; font-size: 1.3rem; font-weight: 700; }
    #complete-panel p { color: #94a3b8; font-size: 0.9rem; line-height: 1.5; }
    #perm {
      display: none; max-width: 380px; text-align: left; color: #cbd5e1;
      padding: 16px 18px; line-height: 1.55; font-size: 0.88rem;
      background: #0f172a; border: 1px solid #334155; border-radius: 14px;
      margin-top: 12px;
    }
    #perm ol { margin: 8px 0 12px 18px; color: #94a3b8; }
    #perm li { margin: 4px 0; }
    #retry-cam {
      pointer-events: auto; cursor: pointer; border: 0; border-radius: 10px;
      padding: 10px 16px; font-weight: 650; font-size: 0.9rem;
      background: #38bdf8; color: #0f172a; width: 100%;
    }
  </style>
</head>
<body>
  <div id="eyebrow">Face scan</div>
  <div id="instruction">Fit your face in the oval</div>
  <div id="coach">Look at the camera. We’ll enroll you in a few seconds.</div>

  <div id="video-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="mask-canvas"></canvas>
    <canvas id="overlay"></canvas>
    <div id="flash"></div>
  </div>
  <div id="perm"></div>
  <div id="thumbs"></div>
  <div id="status">Starting camera…</div>

  <div id="complete-panel">
    <h2>You’re in</h2>
    <p>Building your face profile now — this usually takes a couple of seconds.</p>
  </div>

  <script>
  window.Streamlit = {
    _send(type, data) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
    },
    sendValue(value) { this._send("streamlit:setComponentValue", { value }); },
    setFrameHeight(h) { this._send("streamlit:setFrameHeight", { height: h || document.body.scrollHeight + 8 }); },
    setComponentReady() { this._send("streamlit:componentReady", { apiVersion: 1 }); },
  };
  window.Streamlit.setComponentReady();
  window.Streamlit.setFrameHeight(680);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
  <script>
  const Streamlit = window.Streamlit;
  const TARGET = 8;
  const HOLD_MS = 280;
  const SNAP_GAP_MS = 140;

  let captured = [];
  let goodSince = null;
  let lastSnap = 0;
  let done = false;
  let personName = "";

  const video = document.getElementById("video");
  const overlay = document.getElementById("overlay");
  const maskCanvas = document.getElementById("mask-canvas");
  const flash = document.getElementById("flash");
  const instrEl = document.getElementById("instruction");
  const coachEl = document.getElementById("coach");
  const thumbsEl = document.getElementById("thumbs");
  const statusEl = document.getElementById("status");

  window.addEventListener("message", (e) => {
    const name = e.data?.args?.person_name;
    if (name) {
      personName = name;
      document.getElementById("eyebrow").textContent = "Scanning " + name;
    }
  });

  function ovalGeom(W, H) {
    return { cx: W * 0.5, cy: H * 0.46, rx: W * 0.28, ry: H * 0.36 };
  }

  function draw(W, H, state) {
    const { cx, cy, rx, ry } = ovalGeom(W, H);
    const ready = state === "good" || state === "capturing";
    const color = ready ? "#34d399" : (state === "face" ? "#38bdf8" : "#64748b");
    const ctx = overlay.getContext("2d");
    ctx.clearRect(0, 0, W, H);
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.strokeStyle = color;
    ctx.lineWidth = ready ? 4 : 2.4;
    ctx.stroke();
    const pct = captured.length / TARGET;
    if (pct > 0) {
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx + 10, ry + 10, 0, -Math.PI / 2, -Math.PI / 2 + pct * Math.PI * 2);
      ctx.strokeStyle = "#34d399";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.stroke();
    }
    const mctx = maskCanvas.getContext("2d");
    mctx.clearRect(0, 0, W, H);
    mctx.fillStyle = "rgba(2,6,23,0.62)";
    mctx.fillRect(0, 0, W, H);
    mctx.globalCompositeOperation = "destination-out";
    mctx.beginPath();
    mctx.ellipse(cx, cy, rx + 2, ry + 2, 0, 0, Math.PI * 2);
    mctx.fill();
    mctx.globalCompositeOperation = "source-over";
  }

  function boxOf(det) {
    const b = det.boundingBox || {};
    if (b.xCenter != null) return b;
    const w = b.width || 0.3;
    const h = b.height || 0.4;
    return {
      xCenter: (b.originX || 0) + w / 2,
      yCenter: (b.originY || 0) + h / 2,
      width: w,
      height: h,
    };
  }

  function scoreFace(det, W, H) {
    const box = boxOf(det);
    const fx = box.xCenter * W;
    const fy = box.yCenter * H;
    const fw = box.width * W;
    const { cx, cy, rx } = ovalGeom(W, H);
    const dx = Math.abs((W - fx) - cx) / rx;
    const dy = Math.abs(fy - cy) / ovalGeom(W, H).ry;
    const centered = dx < 0.42 && dy < 0.42;
    const fill = fw / (rx * 2);
    const sizeOk = fill > 0.62 && fill < 1.18;
    let frontal = true;
    const lms = det.landmarks || [];
    if (lms.length >= 3) {
      const re = lms[0], le = lms[1], nose = lms[2];
      const mid = (re.x + le.x) / 2;
      frontal = Math.abs(nose.x - mid) < 0.045 && Math.abs(re.y - le.y) < 0.04;
    }
    const conf = Array.isArray(det.score) ? Number(det.score[0] || 1) : Number(det.score != null ? det.score : 1);
    return { centered, sizeOk, frontal, fill, conf, ok: centered && sizeOk && frontal && conf >= 0.5 };
  }

  function coachFrom(has, s) {
    if (!has) return "Look into the oval";
    if (!s.sizeOk && s.fill < 0.62) return "Move a little closer";
    if (!s.sizeOk && s.fill > 1.18) return "Move back a little";
    if (!s.centered) return "Center your face";
    if (!s.frontal) return "Look straight at the camera";
    return captured.length ? "Hold still — capturing" : "Perfect — hold still";
  }

  function snap() {
    const W = video.videoWidth || 480;
    const H = video.videoHeight || 640;
    const sc = document.createElement("canvas");
    sc.width = W; sc.height = H;
    sc.getContext("2d").drawImage(video, 0, 0, W, H);
    const dataUrl = sc.toDataURL("image/jpeg", 0.88);
    flash.style.opacity = "0.7";
    setTimeout(() => { flash.style.opacity = "0"; }, 70);
    const img = document.createElement("img");
    img.className = "thumb";
    img.src = dataUrl;
    thumbsEl.appendChild(img);
    captured.push({ pose: "front", data: dataUrl });
    statusEl.textContent = captured.length + " / " + TARGET;
    if (captured.length >= TARGET) finish();
  }

  function finish() {
    if (done) return;
    done = true;
    instrEl.textContent = "You’re in";
    coachEl.textContent = "Building your face profile…";
    statusEl.textContent = "";
    Streamlit.sendValue({ status: "complete", captures: captured });
    document.getElementById("video-wrap").style.display = "none";
    document.getElementById("complete-panel").style.display = "flex";
    try { video.srcObject && video.srcObject.getTracks().forEach(t => t.stop()); } catch (e) {}
    Streamlit.setFrameHeight(280);
  }

  function onResults(results) {
    if (done) return;
    const W = overlay.width, H = overlay.height;
    const dets = results.detections || [];
    const det = dets[0];
    if (!det) {
      goodSince = null;
      instrEl.textContent = "Fit your face in the oval";
      coachEl.textContent = "Look into the oval";
      draw(W, H, "none");
      return;
    }
    const s = scoreFace(det, W, H);
    const now = performance.now();
    instrEl.textContent = s.ok ? "Hold still" : "Fit your face in the oval";
    coachEl.textContent = coachFrom(true, s);
    draw(W, H, s.ok ? (captured.length ? "capturing" : "good") : "face");
    if (!s.ok) { goodSince = null; return; }
    if (!goodSince) goodSince = now;
    if (now - goodSince < HOLD_MS) return;
    if (now - lastSnap < SNAP_GAP_MS) return;
    lastSnap = now;
    snap();
  }

  function showBlocked() {
    const permEl = document.getElementById("perm");
    permEl.style.display = "block";
    instrEl.textContent = "Camera is blocked";
    coachEl.textContent = "Allow the camera, or scroll down and upload photos.";
    statusEl.textContent = "";
    permEl.innerHTML =
      "<strong>Click the camera icon with the red X in the address bar.</strong>" +
      "<ol><li>Choose <b>Allow</b> for 127.0.0.1.</li>" +
      "<li>Tap <b>Retry camera</b>.</li></ol>" +
      "<button id='retry-cam' type='button'>Retry camera</button>";
    const btn = document.getElementById("retry-cam");
    if (btn) btn.onclick = () => { permEl.style.display = "none"; init(); };
    Streamlit.setFrameHeight(560);
  }

  async function init() {
    statusEl.textContent = "Starting camera…";
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 960 } },
        audio: false,
      });
    } catch (err) {
      showBlocked();
      return;
    }
    document.getElementById("perm").style.display = "none";
    video.srcObject = stream;
    await new Promise((r) => { video.onloadedmetadata = r; });
    await video.play();

    const W = video.videoWidth || 480;
    const H = video.videoHeight || 640;
    overlay.width = W; overlay.height = H;
    maskCanvas.width = W; maskCanvas.height = H;
    const wrap = document.getElementById("video-wrap");
    const showW = 340;
    wrap.style.width = showW + "px";
    wrap.style.height = Math.round(showW * (H / W)) + "px";
    draw(W, H, "none");
    instrEl.textContent = "Fit your face in the oval";
    coachEl.textContent = "Look at the camera. We’ll enroll you in a few seconds.";
    statusEl.textContent = "Align your face";

    if (typeof FaceDetection === "undefined") {
      statusEl.textContent = "Detector still loading… stay in the oval.";
      let n = 0;
      const fallback = setInterval(() => {
        if (done) { clearInterval(fallback); return; }
        n += 1;
        snap();
        if (n >= TARGET) clearInterval(fallback);
      }, 220);
      return;
    }

    const detector = new FaceDetection({
      locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${f}`,
    });
    detector.setOptions({ model: "short", minDetectionConfidence: 0.55 });
    detector.onResults(onResults);
    const cam = new Camera(video, {
      onFrame: async () => { if (!done) await detector.send({ image: video }); },
      width: W,
      height: H,
    });
    cam.start();
  }

  init();
  </script>
</body>
</html>
