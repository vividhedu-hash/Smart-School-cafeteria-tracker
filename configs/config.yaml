application:
  name: "Smart Cafeteria Waste Tracker"
  debug: true
  log_level: "INFO"        # DEBUG, INFO, WARNING, ERROR
  runtime_state_path: "data/runtime_state.json"
  commands_path: "data/commands.json"
  api_host: "127.0.0.1"
  api_port: 8765

camera:
  mode: webcam              # webcam | rtsp
  source: auto              # auto = first working webcam (0, then 1, 2, 3)
  width: auto               # auto = camera native, capped by max_capture_width
  height: auto
  fps: 30
  max_capture_width: 1920   # 4K sensors are stepped down so laptops stay real-time
  buffer_size: 3            # tighter buffer = lower latency
  reconnect_delay_seconds: 3.0
  reconnect_max_attempts: 10
  # For two-camera future deployment:
  # cameras:
  #   plate:
  #     source: 0
  #   face:
  #     source: 1

roi:
  plate:
    x1: 0.05
    y1: 0.40
    x2: 0.95
    y2: 1.00
  face:
    x1: 0.05
    y1: 0.00
    x2: 0.95
    y2: 0.55

models:
  plate:
    weights: "models/plate/best.pt"
    confidence: 0.55
    iou: 0.50
    classes: null           # null = all classes; [0] = class 0 only
    # HONESTY GATE: if true and no trained plate model exists, fall back to a
    # pretrained COCO model (detects bowls/cups/plates-ish objects). This is a
    # DEMO PROXY, not real plate detection — it is clearly labelled in the
    # dashboard and logs. Default false. Visual OpenCV fallback is separate.
    allow_coco_fallback: false
    allow_visual_fallback: true
  waste:
    weights: "models/waste/best.pt"
    confidence: 0.55
    iou: 0.50
    allow_visual_fallback: true
    # Waste classification label map (auto-detected from training)
    classes:
      0: "EMPTY"
      1: "LOW_WASTE"
      2: "MEDIUM_WASTE"
      3: "HIGH_WASTE"

recognition:
  model_pack: "buffalo_s"   # fast ArcFace model — same embedding quality, 3x faster than buffalo_l
  similarity_threshold: 0.52  # ArcFace cosine; 0.40 was too permissive for buffalo
  frames_to_vote: 2          # vote over 2 frames only — reduces latency massively
  minimum_face_size: 24      # lock/draw as soon as a walking face is visible
  identify_face_size: 40     # identify a bit earlier so a walk-across still matches
  max_event_duration_seconds: 4.0
  embedding_dir: "data/enrollment"
  det_size: [320, 320]       # 320 on a face-ROI crop; full-frame 480 was ~800ms
  det_thresh: 0.40           # slightly looser for motion blur
  infer_max_width: 640       # search window after ROI/lock crop
  bbox_hold_frames: 12       # fallback if time hold is unavailable
  bbox_hold_seconds: 0.90    # coast the lock while a walker is briefly missed
  motion_pad_ratio: 0.90     # search pad around the lock; grows when they move fast

event:
  minimum_plate_presence_seconds: 0.20
  cooldown_seconds: 2.0
  timeout_seconds: 4.0
  best_frame_window: 10     # choose best from last N buffered frames

storage:
  database: "database/cafeteria.db"
  captures: "data/captures"
  review_queue: "data/review_queue"
  datasets: "data/datasets"
  models: "models"
  frames: "data/frames"
  exports: "data/exports"

training:
  default_base_model: "yolov8n-cls.pt"   # for waste classification
  plate_base_model: "yolov8n.pt"          # for plate detection
  default_epochs: 50
  default_image_size: 640
  default_batch: 16
  train_ratio: 0.70
  val_ratio: 0.20
  test_ratio: 0.10
  random_seed: 42
  output_base: "models"
  # Closed ML loop: live plate crops → review/label → dataset → retrain → hot-swap
  ml_loop:
    enabled: true
    auto_enqueue: true
    min_confidence_to_enqueue: 0.40
    promote_auto_confirmed: true      # high-conf AUTO_CONFIRMED → dataset directly
    auto_confirm_min_confidence: 0.85
    retrain_after_n_labels: 8         # new labels since last train before retrain
    min_images_per_class: 4
    auto_activate: true               # activate if score ≥ min and ≥ active model
    auto_activate_min_accuracy: 0.50
    retrain_epochs: 15
    retrain_image_size: 224
    retrain_batch: 8

monitoring:
  state_write_interval_seconds: 0.1  # write every 100ms so dashboard updates in near real-time
  metrics_history_size: 300          # keep last N latency samples

inference:
  frame_skip: 2             # process every 2nd frame for plate detection — CPU relief
  debug_window: false       # headless mode for web dashboard (no desktop popup needed)

